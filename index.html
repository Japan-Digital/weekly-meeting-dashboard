<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japan Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header class="page-header">
        <img src="assets/logo.svg" alt="Turner &amp; Townsend" class="logo" />
        <h1>
          We
          <span id="rotating-word" class="rotating-word">transform</span>
          together.
        </h1>
        <p>Pick a name, then spin the wheel for their question.</p>
      </header>

      <section class="panels">
        <article class="panel">
          <h2>1. Pick a name</h2>
          <div id="name-display" class="result-display" aria-live="polite">
            —
          </div>
          <button id="pick-name-btn" type="button">Pick a name</button>
        </article>

        <article class="panel">
          <h2>2. Spin for a question</h2>
          <div class="wheel-wrap">
            <div class="wheel-pointer" aria-hidden="true"></div>
            <canvas
              id="wheel-canvas"
              width="320"
              height="320"
              aria-hidden="true"
            ></canvas>
          </div>
          <button id="spin-btn" type="button">Spin the wheel</button>
          <div id="question-display" class="result-display" aria-live="polite">
            —
          </div>
        </article>
      </section>

      <footer class="page-footer">Built by Keith Ng</footer>
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
